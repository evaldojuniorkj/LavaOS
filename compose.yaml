# Só para desenvolvimento local: Postgres 16 em loopback, nunca exposto à rede.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres_local_dev
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-local-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
